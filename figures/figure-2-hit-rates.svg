<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">실험별 지정 취약점 적중률</title>
  <desc id="desc">B0와 P1의 지정 취약점 적중률을 실험별로 비교한다. VJBench는 공통으로 유효한 41개 입력의 쌍대 결과를 표시한다. Vul4J의 세 모델 설정과 Vul4J Plus에서는 P1이 높았고, VJBench 공통 사례에서는 같았으며, CWE-Bench-Java에서는 B0가 높았다.</desc>
  <style>
    text { font-family: "Malgun Gothic", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .title { font-size: 23px; font-weight: 600; }
    .label { font-size: 15px; }
    .axis { font-size: 13px; fill: #475569; }
    .note { font-size: 13px; fill: #475569; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .connector { stroke: #94a3b8; stroke-width: 2; }
  </style>
  <text x="540" y="34" text-anchor="middle" class="title">실험별 지정 취약점 적중률</text>
  <circle cx="725" cy="66" r="7" fill="#1d4ed8"/><text x="740" y="71" class="axis">B0</text>
  <path d="M802 58 L810 66 L802 74 L794 66 Z" fill="#c2410c"/><text x="818" y="71" class="axis">P1</text>
  <text x="315" y="105" text-anchor="middle" class="axis">지정 취약점 적중률 (%)</text>
  <g class="axis" text-anchor="middle">
    <text x="315" y="132">0</text><text x="415" y="132">10</text><text x="515" y="132">20</text>
    <text x="615" y="132">30</text><text x="715" y="132">40</text><text x="815" y="132">50</text>
  </g>
  <g class="grid">
    <path d="M315 140 V520"/><path d="M415 140 V520"/><path d="M515 140 V520"/>
    <path d="M615 140 V520"/><path d="M715 140 V520"/><path d="M815 140 V520"/>
  </g>
  <g class="label">
    <text x="24" y="174">Vul4J · Flash High · n=79</text>
    <text x="24" y="224">Vul4J · Flash Max · n=79</text>
    <text x="24" y="274">Vul4J · Pro Max · n=79</text>
    <text x="24" y="344">VJBench · Flash Max Top-1 · 공통 41/42</text>
    <text x="24" y="414">Vul4J+ · Flash Max Top-1 · n=140</text>
    <text x="24" y="494">CWE-Bench-Java† · Flash Max Top-1 · n=212</text>
  </g>
  <g class="axis" text-anchor="end">
    <text x="1012" y="169" fill="#1d4ed8">B0 12.66% (10/79)</text><text x="1012" y="185" fill="#c2410c">P1 18.99% (15/79)</text>
    <text x="1012" y="219" fill="#1d4ed8">B0 12.66% (10/79)</text><text x="1012" y="235" fill="#c2410c">P1 13.92% (11/79)</text>
    <text x="1012" y="269" fill="#1d4ed8">B0 13.92% (11/79)</text><text x="1012" y="285" fill="#c2410c">P1 16.46% (13/79)</text>
    <text x="1012" y="339" fill="#1d4ed8">B0 46.34% (19/41)</text><text x="1012" y="355" fill="#c2410c">P1 46.34% (19/41)</text>
    <text x="1012" y="409" fill="#1d4ed8">B0 32.14% (45/140)</text><text x="1012" y="425" fill="#c2410c">P1 42.14% (59/140)</text>
    <text x="1012" y="489" fill="#1d4ed8">B0 45.75% (97/212)</text><text x="1012" y="505" fill="#c2410c">P1 43.40% (92/212)</text>
  </g>
  <g class="connector">
    <path d="M441.6 174 H504.9"/><path d="M441.6 224 H454.2"/><path d="M454.2 274 H479.6"/>
    <path d="M778.4 339 L778.4 349"/><path d="M636.4 414 H736.4"/><path d="M772.5 494 H749"/>
  </g>
  <g>
    <circle cx="441.6" cy="174" r="7" fill="#1d4ed8"/><path d="M504.9 166 L512.9 174 L504.9 182 L496.9 174 Z" fill="#c2410c"/>
    <circle cx="441.6" cy="224" r="7" fill="#1d4ed8"/><path d="M454.2 216 L462.2 224 L454.2 232 L446.2 224 Z" fill="#c2410c"/>
    <circle cx="454.2" cy="274" r="7" fill="#1d4ed8"/><path d="M479.6 266 L487.6 274 L479.6 282 L471.6 274 Z" fill="#c2410c"/>
    <circle cx="778.4" cy="339" r="7" fill="#1d4ed8"/><path d="M778.4 341 L786.4 349 L778.4 357 L770.4 349 Z" fill="#c2410c"/>
    <circle cx="636.4" cy="414" r="7" fill="#1d4ed8"/><path d="M736.4 406 L744.4 414 L736.4 422 L728.4 414 Z" fill="#c2410c"/>
    <circle cx="772.5" cy="494" r="7" fill="#1d4ed8"/><path d="M749 486 L757 494 L749 502 L741 494 Z" fill="#c2410c"/>
  </g>
  <path d="M18 454 H1060" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="24" y="470" class="note">† 결과 확인 후 본문 비교에서 제외한 실험을 별도 표시. 전체 실험을 하나의 적중률로 합산하지 않음.</text>
  <text x="24" y="553" class="note">Vul4J는 다중 후보 제출, VJBench와 Vul4J+는 Top-1 제출 방식이다. 행 간 직접 비교에는 주의가 필요하다.</text>
  <text x="24" y="576" class="note">VJBench case-019는 B0 입력 오류로 쌍대 비교에서 제외했다. P1 전체 적중은 20/42다.</text>
  <text x="24" y="607" class="note">미적중은 지정 취약점을 제출하지 못했다는 뜻이며, 다른 후보의 오탐 여부를 뜻하지 않는다.</text>
</svg>
