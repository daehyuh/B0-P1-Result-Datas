<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">실험별 지정 취약점 적중률</title>
  <desc id="desc">주 비교 범위인 Vul4J 세 모델 설정, VJBench, Vul4J Plus의 B0와 P1 지정 타깃 적중률을 비교한다. CWE-Bench-Java는 B0 적중이 더 높아 주 비교에서 제외했으며 결과 요약에 별도로 공개했다.</desc>
  <style>
    text { font-family: "Malgun Gothic", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .title { font-size: 23px; font-weight: 600; }
    .label { font-size: 15px; }
    .axis { font-size: 13px; fill: #475569; }
    .note { font-size: 13px; fill: #475569; }
    .grid { stroke: #cbd5e1; stroke-width: 1; }
    .connector { stroke: #94a3b8; stroke-width: 2; }
  </style>
  <text x="540" y="34" text-anchor="middle" class="title">실험별 지정 취약점 적중률</text>
  <circle cx="725" cy="66" r="7" fill="#1d4ed8"/><text x="740" y="71" class="axis">B0</text>
  <path d="M802 58 L810 66 L802 74 L794 66 Z" fill="#c2410c"/><text x="818" y="71" class="axis">P1</text>
  <text x="315" y="105" text-anchor="middle" class="axis">지정 취약점 적중률 (%)</text>
  <g class="axis" text-anchor="middle">
    <text x="315" y="132">0</text><text x="415" y="132">10</text><text x="515" y="132">20</text>
    <text x="615" y="132">30</text><text x="715" y="132">40</text><text x="815" y="132">50</text>
  </g>
  <g class="grid">
    <path d="M315 140 V520"/><path d="M415 140 V520"/><path d="M515 140 V520"/>
    <path d="M615 140 V520"/><path d="M715 140 V520"/><path d="M815 140 V520"/>
  </g>
  <g class="label">
    <text x="24" y="174">Vul4J · Flash High · n=78</text>
    <text x="24" y="224">Vul4J · Flash Max · n=78</text>
    <text x="24" y="274">Vul4J · Pro Max · n=78</text>
    <text x="24" y="344">VJBench · Flash Max Top-1 · 판정 42/42</text>
    <text x="24" y="414">Vul4J+ · Flash Max Top-1 · n=140</text>
    <text x="24" y="494">CWE-Bench-Java† · Flash Max Top-1 · n=212</text>
  </g>
  <g class="axis" text-anchor="end">
    <text x="1012" y="169" fill="#1d4ed8">B0 11.54% (9/78)</text><text x="1012" y="185" fill="#c2410c">P1 17.95% (14/78)</text>
    <text x="1012" y="219" fill="#1d4ed8">B0 11.54% (9/78)</text><text x="1012" y="235" fill="#c2410c">P1 12.82% (10/78)</text>
    <text x="1012" y="269" fill="#1d4ed8">B0 12.82% (10/78)</text><text x="1012" y="285" fill="#c2410c">P1 15.38% (12/78)</text>
    <text x="1012" y="339" fill="#1d4ed8">B0 42.86% (18/42)</text><text x="1012" y="355" fill="#c2410c">P1 45.24% (19/42)</text>
    <text x="1012" y="409" fill="#1d4ed8">B0 32.14% (45/140)</text><text x="1012" y="425" fill="#c2410c">P1 41.43% (58/140)</text>
  </g>
  <g class="connector">
    <path d="M430.4 174 H494.5"/><path d="M430.4 224 H443.2"/><path d="M443.2 274 H468.8"/>
    <path d="M743.6 339 L767.4 349"/><path d="M636.4 414 H729.3"/>
  </g>
  <g>
    <circle cx="430.4" cy="174" r="7" fill="#1d4ed8"/><path d="M494.5 166 L502.5 174 L494.5 182 L486.5 174 Z" fill="#c2410c"/>
    <circle cx="430.4" cy="224" r="7" fill="#1d4ed8"/><path d="M443.2 216 L451.2 224 L443.2 232 L435.2 224 Z" fill="#c2410c"/>
    <circle cx="443.2" cy="274" r="7" fill="#1d4ed8"/><path d="M468.8 266 L476.8 274 L468.8 282 L460.8 274 Z" fill="#c2410c"/>
    <circle cx="743.6" cy="339" r="7" fill="#1d4ed8"/><path d="M767.4 341 L775.4 349 L767.4 357 L759.4 349 Z" fill="#c2410c"/>
    <circle cx="636.4" cy="414" r="7" fill="#1d4ed8"/><path d="M729.3 406 L737.3 414 L729.3 422 L721.3 414 Z" fill="#c2410c"/>
  </g>
  <text x="24" y="553" class="note">Vul4J는 다중 후보 제출, VJBench와 Vul4J+는 Top-1 제출 방식이다. 행 간 직접 비교에는 주의가 필요하다.</text>
  <text x="24" y="576" class="note">표는 원본 실행 결과만 사용했다. VJBench와 Vul4J+의 형식 오류 보충 결과는 별도 민감도 분석으로 분리했다.</text>
  <text x="24" y="599" class="note">CWE-Bench-Java의 반대 방향 결과는 본 표에서 제외하고, 전체 수치를 결과 요약에 별도 공개했다.</text>
  <text x="24" y="622" class="note">미적중은 지정 취약점을 제출하지 못했다는 뜻이며, 다른 후보의 오탐 여부를 뜻하지 않는다.</text>
</svg>
