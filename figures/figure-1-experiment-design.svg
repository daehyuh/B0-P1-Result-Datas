<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
  <title id="title">B0와 P1 비교 실험의 흐름</title>
  <desc id="desc">같은 취약 소스를 B0와 P1에 제공한다. 두 조건은 공통 파일 도구를 쓰며 P1에는 정적 코드 관계 정보 조회가 더해진다. 각 조건의 LLM 에이전트가 후보를 제출하고, 실행 뒤 데이터셋 정답과 대조해 적중과 탐색 비용을 계산한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 600; }
      .head { font-size: 18px; font-weight: 600; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; }
      .line { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="520" y="38" text-anchor="middle" class="title">B0와 P1 비교 실험의 흐름</text>
  <rect x="330" y="62" width="380" height="74" rx="12" class="box"/>
  <text x="520" y="91" text-anchor="middle" class="head">동일한 취약 소스</text>
  <text x="520" y="116" text-anchor="middle" class="body">사례별 수정 전 코드 · 정답 정보는 분석 후 판정에 사용</text>
  <path d="M520 136 V158 H260 V180" class="line"/>
  <path d="M520 158 H780 V180" class="line"/>
  <rect x="60" y="180" width="400" height="232" rx="14" class="blue"/>
  <text x="260" y="214" text-anchor="middle" class="head">B0 · 기본 도구</text>
  <rect x="92" y="233" width="336" height="72" rx="10" class="box"/>
  <text x="260" y="260" text-anchor="middle" class="body">파일 목록 · 문자열 검색</text>
  <text x="260" y="284" text-anchor="middle" class="body">원본 파일 읽기</text>
  <path d="M260 305 V327" class="line"/>
  <rect x="112" y="329" width="296" height="58" rx="10" class="box"/>
  <text x="260" y="365" text-anchor="middle" class="body">LLM 분석 실행 → 후보 제출</text>
  <rect x="580" y="180" width="400" height="232" rx="14" class="orange"/>
  <text x="780" y="214" text-anchor="middle" class="head">P1 · 관계 정보 도구 추가</text>
  <rect x="612" y="233" width="336" height="72" rx="10" class="box"/>
  <text x="780" y="260" text-anchor="middle" class="body">B0와 같은 파일 목록 · 검색 · 읽기</text>
  <text x="780" y="284" text-anchor="middle" class="body">+ 선언 · 호출 관계 후보 조회</text>
  <path d="M780 305 V327" class="line"/>
  <rect x="632" y="329" width="296" height="58" rx="10" class="box"/>
  <text x="780" y="365" text-anchor="middle" class="body">LLM 분석 실행 → 후보 제출</text>
  <text x="520" y="438" text-anchor="middle" class="small">※ P1에는 선언 검색과 일부 입력·설정 단서도 포함되어 관계 정보만의 효과로 분리되지 않음</text>
  <path d="M260 412 V463 H520 V484" class="line"/>
  <path d="M780 412 V463 H520" class="line"/>
  <rect x="160" y="486" width="720" height="83" rx="12" class="green"/>
  <text x="520" y="516" text-anchor="middle" class="head">사후 판정 및 비교</text>
  <text x="520" y="543" text-anchor="middle" class="body">지정 취약점 적중 · 도구 사용량 · 실행 시간 · 토큰 · 추정 API 비용</text>
  <text x="520" y="590" text-anchor="middle" class="small">관계 정보 구성 시간과 저장 공간은 LLM 실행 자원과 별도로 보고</text>
</svg>
